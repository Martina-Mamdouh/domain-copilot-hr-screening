<div class="login-container">
  <div class="login-card glass-panel animate-fade-in">
    <div class="logo-area">
      <div class="logo-icon"></div>
      <h2>Domain Copilot</h2>
      <p>Sign in to access the HR Screening platform</p>
    </div>

    <div class="alert alert-error" *ngIf="errorMsg">
      {{errorMsg}}
    </div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="input-glass" [(ngModel)]="credentials.email" name="email" required placeholder="admin@domain.com">
      </div>
      
      <div class="form-group mt-3">
        <label>Password</label>
        <input type="password" class="input-glass" [(ngModel)]="credentials.password" name="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn-primary mt-4 w-100" [disabled]="isLoading || !credentials.email || !credentials.password">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>
    </form>
  </div>
</div>
