<ng-container *ngIf="authService.isAuthenticated(); else loginView">
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar glass-panel">
      <div class="logo">
        <div class="logo-icon"></div>
        <h2>Domain Copilot</h2>
      </div>
      
      <nav class="nav-menu">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <span class="icon">📊</span>
          <span>Dashboard</span>
        </a>
        <a *ngIf="authService.hasRole('Admin')" routerLink="/corpus" routerLinkActive="active" class="nav-item">
          <span class="icon">📄</span>
          <span>Corpus Ingestion</span>
        </a>
        <a routerLink="/copilot" routerLinkActive="active" class="nav-item">
          <span class="icon">💬</span>
          <span>Copilot Chat</span>
        </a>
      </nav>
      
      <div class="user-profile">
        <div class="avatar">{{authService.currentUser()?.fullName?.charAt(0) || 'U'}}</div>
        <div class="user-info">
          <span class="name">{{authService.currentUser()?.fullName || 'User'}}</span>
          <span class="role">{{authService.currentUser()?.roles?.[0] || 'Admin'}}</span>
          <a href="javascript:void(0)" (click)="logout()" style="color:var(--danger); font-size: 0.75rem; text-decoration: none; margin-top: 4px;">Logout</a>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="topbar glass-panel">
        <div class="search-bar">
          <input type="text" class="input-glass" placeholder="Search candidates...">
        </div>
        <div class="actions">
          <a *ngIf="authService.hasRole('Admin') || authService.hasRole('Recruiter')" routerLink="/screening/new" class="btn-primary" style="text-decoration:none;">New Screening</a>
        </div>
      </header>

      <div class="content-wrapper animate-fade-in">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</ng-container>

<ng-template #loginView>
  <router-outlet></router-outlet>
</ng-template>
