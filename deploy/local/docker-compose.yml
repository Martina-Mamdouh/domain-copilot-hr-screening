version: '3.8'

services:
  dev-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: domain-copilot-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
