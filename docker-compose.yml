version: '3.8'

services:
  dev-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: domain-copilot-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SuperStrong!Passw0rd
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "SuperStrong!Passw0rd", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: domain-copilot-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=dev-db,1433;Database=DomainCopilotDb;User Id=sa;Password=SuperStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - Ollama__BaseUrl=http://host.docker.internal:11434
    ports:
      - "8080:8080"
    depends_on:
      dev-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  seeder:
    image: curlimages/curl
    container_name: domain-copilot-seeder
    volumes:
      - ./corpus:/corpus
      - ./scripts:/scripts
    entrypoint: ["/bin/sh", "/scripts/seed.sh"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      - API_URL=http://api:8080

  web:
    build:
      context: ./src/DomainCopilot.Web
      dockerfile: Dockerfile
    container_name: domain-copilot-web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sqldata:
